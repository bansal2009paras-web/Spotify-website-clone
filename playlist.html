
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spotify - Playlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="logo">Spotify</a>
      <div>
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="login.html">Sign Up</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="playlist-top">
      <img src="https://picsum.photos/150?random=1"
           alt="Today's Top Hits playlist cover">

      <div>
        <p>PLAYLIST</p>
        <h1>Today's Top Hits</h1>
        <p>The biggest songs right now.</p>
        <button type="button" class="btn">Play</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Track</th>
          <th>Artist</th>
          <th>Duration</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>1</td>
          <td>Flowers</td>
          <td>Miley Cyrus</td>
          <td>3:20</td>
        </tr>
        <tr>
          <td>2</td>
          <td>As It Was</td>
          <td>Harry Styles</td>
          <td>2:47</td>
        </tr>
        <tr>
          <td>3</td>
          <td>Starboy</td>
          <td>The Weeknd</td>
          <td>3:50</td>
        </tr>
      </tbody>
    </table>
  </main>

  <footer>
    <p>&copy; 2026 Spotify Clone</p>
  </footer>

</body>
</html>
